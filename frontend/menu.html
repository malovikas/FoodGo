
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FoodGo - Restaurant Menu</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation -->
    <header class="navbar">

        <div class="logo">
            Food<span>Go</span>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#restaurants">Restaurants</a>
            <a href="index.html#categories">Categories</a>

            <a href="cart.html" class="cart-link">
                Cart 🛒
                <span id="cart-count">0</span>
            </a>
        </nav>

    </header>


    <!-- Restaurant Header -->
    <section class="restaurant-header">

        <div class="restaurant-header-content">

            <h1>Pizza Palace</h1>

            <p>
                Italian • Pizza • Fast Food
            </p>

            <div class="restaurant-meta">
                <span class="rating">★ 4.5</span>
                <span>30-40 min</span>
                <span>₹200 for two</span>
            </div>

        </div>

    </section>


    <!-- Menu -->
    <section class="section">

        <div class="section-header">

            <h2>Pizza Palace Menu</h2>

            <p>
                Choose your favorite food
            </p>

        </div>


        <div class="menu-grid" id="menu-container">

            <!-- Menu items will be generated by JavaScript -->

        </div>

    </section>


    <!-- Footer -->
    <footer>

        <div class="footer-content">

            <div>

                <h2>
                    Food<span>Go</span>
                </h2>

                <p>
                    Your favorite food, delivered fast.
                </p>

            </div>


            <div>

                <h3>Quick Links</h3>

                <a href="index.html">
                    Home
                </a>

                <a href="cart.html">
                    Cart
                </a>

            </div>

        </div>


        <div class="footer-bottom">

            © 2026 FoodGo. All rights reserved.

        </div>

    </footer>


    <script src="js/config.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/script.js"></script>

</body>

</html>
