
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FoodGo - Your Cart</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation -->
    <header class="navbar">

        <div class="logo">
            Food<span>Go</span>
        </div>

        <nav>
            <a href="index.html">Home</a>

            <a href="index.html#restaurants">
                Restaurants
            </a>

            <a href="index.html#categories">
                Categories
            </a>

            <a href="cart.html" class="cart-link">
                Cart 🛒
                <span id="cart-count">0</span>
            </a>
        </nav>

    </header>


    <!-- Cart Section -->
    <main class="cart-section">

        <div class="section-header">

            <h1>Your Cart</h1>

            <p>
                Review your items before placing your order.
            </p>

        </div>


        <div class="cart-layout">

            <!-- Cart Items -->
            <div class="cart-items-container">

                <div id="cart-items">

                    <!-- Cart items generated by JavaScript -->

                </div>

            </div>


            <!-- Order Summary -->
            <div class="order-summary">

                <h2>Order Summary</h2>

                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="subtotal">₹0</span>
                </div>

                <div class="summary-row">
                    <span>Delivery Fee</span>
                    <span id="delivery-fee">₹40</span>
                </div>

                <div class="summary-row">
                    <span>Taxes</span>
                    <span id="taxes">₹0</span>
                </div>

                <hr>

                <div class="summary-total">
                    <span>Total</span>
                    <span id="total">₹0</span>
                </div>

                <button
                    id="checkout-btn"
                    class="checkout-btn"
                    onclick="proceedToCheckout()"
                >
                    Proceed to Checkout
                </button>

                <a
                    href="menu.html"
                    class="continue-shopping"
                >
                    ← Continue Shopping
                </a>

            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer>

        <div class="footer-content">

            <div>

                <h2>
                    Food<span>Go</span>
                </h2>

                <p>
                    Your favorite food, delivered fast.
                </p>

            </div>

            <div>

                <h3>Quick Links</h3>

                <a href="index.html">
                    Home
                </a>

                <a href="menu.html">
                    Menu
                </a>

                <a href="cart.html">
                    Cart
                </a>

            </div>

        </div>

        <div class="footer-bottom">
            © 2026 FoodGo. All rights reserved.
        </div>

    </footer>

    <script src="js/config.js"></script>
    <script src="js/cart.js"></script>
    


</body>

</html>
