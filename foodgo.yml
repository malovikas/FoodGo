# ==========================================
# FoodGo Kubernetes Deployment
# ==========================================

# -------------------------
# USER SERVICE
# -------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: malovikas/foodgo-user-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5001

---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: default
spec:
  selector:
    app: user-service
  ports:
    - port: 5001
      targetPort: 5001
  type: ClusterIP

